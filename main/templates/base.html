<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ page_description }}">
    {% if noindex %}
    <meta name="robots" content="noindex, nofollow">
    {% else %}
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ canonical_base_url }}{{ current_path }}">
    {% endif %}

    <!-- OpenGraph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ page_description }}">

    <link rel="stylesheet" href="/static/style.css?v=1.1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="/static/htmx.min.js?v=4.0.0"></script>
    <script src="/static/app.js?v=1.1.0" defer></script>
</head>
<body>
    <header class="app-header">
        <h1>Add Post (SAHAR)</h1>
        <nav id="main-nav">
            <a href="/"
               data-hx-get="/"
               data-hx-target="#main-content"
               data-hx-swap="innerHTML"
               data-hx-push-url="true"
               class="nav-link {% if current_path == "/" %}active{% endif %}">Home</a>
            <a href="/blog"
               data-hx-get="/blog"
               data-hx-target="#main-content"
               data-hx-swap="innerHTML"
               data-hx-push-url="true"
               class="nav-link {% if current_path.starts_with("/blog") || current_path.starts_with("/posts/") %}active{% endif %}">Blog</a>
        </nav>
    </header>

    <div id="toast-container"></div>

    <main id="main-content" data-hx-history-elt>
        {{ content_html|safe }}
    </main>
</body>
</html>
