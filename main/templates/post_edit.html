{% match post %}
{% when Some with (post) %}
<div class="card" id="edit-card">
    <h2>Edit post</h2>
    
    <form id="edit-form"
          action="/api/posts/{{ post.id_hex }}/edit"
          method="POST"
          hx-post="/api/posts/{{ post.id_hex }}/edit"
          hx-target="#main-content"
          hx-swap="innerHTML"
          autocomplete="off">
        <div class="input-group">
            <label for="edit-title">Title</label>
            <input type="text"
                   id="edit-title"
                   name="title"
                   class="input-field"
                   autocomplete="off"
                   maxlength="150"
                   placeholder="Max 150 chars"
                   value="{{ post.title }}"
                   data-original="{{ post.title }}" />
        </div>

        <div class="input-group">
            <label for="edit-content">* Text</label>
            <textarea id="edit-content"
                      name="content"
                      class="input-field textarea"
                      autocomplete="off"
                      required
                      maxlength="3000"
                      placeholder="Max 3000 chars"
                      data-original="{{ post.content }}">{{ post.content }}</textarea>
        </div>

        <div class="edit-buttons-row">
            <a href="{{ back_url }}"
               hx-get="{{ back_url }}"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="btn btn-outline">Back</a>

            <button type="button"
                    id="cancel-edit-btn"
                    class="btn btn-outline hidden"
                    hidden>Cancel</button>

            <button type="submit"
                    id="publish-edit-btn"
                    class="btn btn-black hidden"
                    hidden
                    disabled>Publish</button>
        </div>
    </form>
</div>
{% when None %}
<div class="card">
    <h2>404 — Post not found</h2>
    <p class="post-counter">This post does not exist or has been deleted.</p>
    <a href="/blog"
       hx-get="/blog"
       hx-target="#main-content"
       hx-swap="innerHTML"
       hx-push-url="true"
       class="btn">Back to Feed</a>
</div>
{% endmatch %}
